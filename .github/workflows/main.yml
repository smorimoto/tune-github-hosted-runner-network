name: Diagnose issue 5

on: push

permissions: read-all

jobs:
  diagnose:
    name: ${{ matrix.os }} ${{ matrix.attempt }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-latest
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
          - ubuntu-26.04-arm
        attempt: [1, 2, 3, 4, 5]
        include:
          - os: ubuntu-slim
            attempt: 1

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v7

      - name: Observe interfaces
        shell: bash
        run: bash .github/diagnose.sh

      - name: Run the action as released
        uses: ./
